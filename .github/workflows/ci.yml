name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Build - Install dependencies
      run: pip install -r requirements.txt

    - name: Test - Run pytest with coverage
      run: pytest tests/ --cov --junitxml=report.xml

    - name: Lint - Check with flake8
      run: flake8 app.py

    - name: Lint - Check with black
      run: black --check app.py

  build-docker:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Docker - Build image
      run: docker build -t mon-app:${{ github.sha }} .
